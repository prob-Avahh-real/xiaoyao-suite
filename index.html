<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#c5d4d8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>逍遥游组曲</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #c5d4d8;
      --sky-deep: #a8bcc4;
      --ink: #1a2a32;
      --ink-soft: rgba(26, 42, 50, 0.58);
      --ink-faint: rgba(26, 42, 50, 0.16);
      --accent: #2a4a5e;
      --haze: #7a9a8e;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --font-brand: "Liu Jian Mao Cao", "Noto Serif SC", cursive;
      --font-body: "Noto Serif SC", "Songti SC", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--sky);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 100% 60% at 50% -15%, rgba(255, 255, 255, 0.55), transparent 55%),
        radial-gradient(ellipse 70% 45% at 100% 80%, rgba(122, 154, 142, 0.28), transparent 50%),
        radial-gradient(ellipse 55% 40% at 0% 60%, rgba(42, 74, 94, 0.12), transparent 45%),
        linear-gradient(175deg, #d0dde0 0%, #c5d4d8 45%, #b4c6cc 100%);
    }

    .app {
      height: 100%;
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--safe-t) 0 var(--safe-b);
    }

    header.hero {
      padding: 1.35rem 1.4rem 0.75rem;
      position: relative;
      z-index: 2;
    }

    #brand {
      font-family: var(--font-brand);
      font-size: clamp(2.8rem, 12vw, 3.6rem);
      letter-spacing: 0.08em;
      line-height: 1.05;
      color: var(--ink);
      animation: brandRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .tagline {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      color: var(--ink-soft);
      text-indent: 0.28em;
      animation: fadeUp 1s 0.15s ease both;
    }

    #stage {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0.5rem 1.4rem 1rem;
      min-height: 0;
    }

    #ink {
      position: absolute;
      inset: 6% 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 48% 38%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 60%),
        radial-gradient(circle at 72% 68%, rgba(122, 154, 142, 0.25), transparent 52%);
      filter: blur(2px);
      opacity: 0.88;
      transition: background 0.8s ease;
      pointer-events: none;
    }
    #ink.pulse-a { animation: inkPulse 2.4s ease; }
    #ink.pulse-b { animation: inkDrift 2.8s ease; }
    #ink.pulse-c { animation: inkSoft 2.2s ease; }
    #ink.note { transform: scale(1.04); transition: transform 0.18s ease; }

    .card-mv {
      position: relative;
      z-index: 1;
      width: min(100%, 22rem);
      text-align: center;
      animation: fadeUp 0.9s 0.2s ease both;
    }

    #roman {
      font-size: 0.75rem;
      letter-spacing: 0.45em;
      color: var(--accent);
      font-weight: 600;
    }

    #mv-title {
      font-family: var(--font-brand);
      font-size: clamp(3.4rem, 17vw, 4.6rem);
      line-height: 1;
      margin: 0.3rem 0 0.1rem;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
    }

    #mv-subtitle {
      font-size: 1.02rem;
      letter-spacing: 0.28em;
      color: var(--ink-soft);
      text-indent: 0.28em;
    }

    #epigraph {
      margin: 1.25rem auto 0;
      max-width: 18rem;
      font-size: 0.92rem;
      line-height: 1.75;
      color: var(--ink);
      letter-spacing: 0.05em;
    }

    .meta {
      margin-top: 1.1rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }

    .bar-wrap {
      margin: 1.4rem auto 0;
      width: min(100%, 16rem);
      height: 2px;
      background: var(--ink-faint);
      border-radius: 1px;
      overflow: hidden;
    }
    #progress {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    #dots {
      display: flex;
      justify-content: center;
      gap: 0.55rem;
      margin-top: 1.1rem;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: none;
      background: var(--ink-faint);
      cursor: pointer;
      padding: 0;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .dot.on {
      background: var(--accent);
      transform: scale(1.35);
    }

    footer.controls {
      padding: 0.6rem 1.2rem calc(1rem + var(--safe-b));
      display: grid;
      gap: 0.65rem;
      z-index: 2;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
    }

    button.ctrl {
      font-family: var(--font-body);
      border: 1px solid var(--ink-faint);
      background: rgba(255, 255, 255, 0.35);
      color: var(--ink);
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    button.ctrl:active { transform: scale(0.96); }

    #btn-play {
      width: 4.2rem;
      height: 4.2rem;
      border-radius: 50%;
      font-size: 1.25rem;
      letter-spacing: 0.15em;
      border-color: color-mix(in srgb, var(--accent) 45%, var(--ink-faint));
      background: color-mix(in srgb, var(--accent) 12%, rgba(255,255,255,0.4));
    }
    #btn-play[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,0.25));
    }

    #btn-prev, #btn-next {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      font-size: 0.95rem;
    }

    #btn-wear {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
    }
    #btn-wear.on {
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      color: var(--accent);
    }

    #hint {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      min-height: 1.2em;
    }

    @keyframes brandRise {
      from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes inkPulse {
      0% { opacity: 0.55; transform: scale(0.92); }
      45% { opacity: 0.95; transform: scale(1.06); }
      100% { opacity: 0.88; transform: scale(1); }
    }
    @keyframes inkDrift {
      0% { opacity: 0.5; transform: translateY(6%) scale(0.96); }
      100% { opacity: 0.88; transform: none; }
    }
    @keyframes inkSoft {
      0% { opacity: 0.4; filter: blur(8px); }
      100% { opacity: 0.88; filter: blur(2px); }
    }

    @media (max-width: 280px), (max-height: 300px) {
      #brand { font-size: 1.4rem; letter-spacing: 0.06em; }
      .tagline { font-size: 0.55rem; letter-spacing: 0.12em; }
      #mv-title { font-size: 1.9rem; }
      #mv-subtitle { font-size: 0.68rem; letter-spacing: 0.12em; }
      #epigraph { font-size: 0.62rem; margin-top: 0.45rem; }
      .meta { font-size: 0.52rem; gap: 0.35rem; margin-top: 0.45rem; }
      #btn-play { width: 2.6rem; height: 2.6rem; font-size: 0.85rem; }
      #btn-prev, #btn-next { width: 2rem; height: 2rem; font-size: 0.7rem; }
      #btn-wear { display: none; }
      #hint { font-size: 0.5rem; }
      header.hero { padding: 0.4rem 0.5rem 0.2rem; }
      footer.controls { padding: 0.25rem 0.4rem 0.4rem; gap: 0.3rem; }
      .bar-wrap { margin-top: 0.5rem; }
      #dots { margin-top: 0.4rem; gap: 0.35rem; }
      .dot { width: 5px; height: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1 id="brand">逍遥游组曲</h1>
      <p class="tagline">七乐章 · 鲲鹏与无待</p>
    </header>

    <main id="stage" data-ink="deep">
      <div id="ink" aria-hidden="true"></div>
      <article class="card-mv">
        <div id="roman">I</div>
        <h2 id="mv-title">冥</h2>
        <p id="mv-subtitle">北冥有鱼</p>
        <p id="epigraph">北冥有鱼，其名为鲲</p>
        <div class="meta">
          <span id="mood">深冥 · 未化</span>
          <span id="mode">羽调</span>
          <span id="tempo">♩ = 46</span>
        </div>
        <div class="bar-wrap" aria-hidden="true"><div id="progress"></div></div>
        <div id="dots" role="tablist" aria-label="乐章"></div>
      </article>
    </main>

    <footer class="controls">
      <div class="row">
        <button type="button" class="ctrl" id="btn-prev" aria-label="上一乐章">←</button>
        <button type="button" class="ctrl" id="btn-play" aria-pressed="false" aria-label="演奏或停止">奏</button>
        <button type="button" class="ctrl" id="btn-next" aria-label="下一乐章">→</button>
      </div>
      <div class="row">
        <button type="button" class="ctrl" id="btn-wear">启戒指 / 手杖</button>
      </div>
      <p id="hint">空格奏止 · 左右键切章</p>
    </footer>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
